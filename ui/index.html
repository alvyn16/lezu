<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Lezu — UI preview</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="shell.css">
  <link rel="stylesheet" href="home.css">
  <link rel="stylesheet" href="details.css">
  <link rel="stylesheet" href="downloads.css">
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  <div id="app"><p class="shell-placeholder" role="status">Loading UI preview…</p></div>
  <noscript>Enable JavaScript to browse this demo library.</noscript>
  <dialog id="notice" aria-labelledby="notice-title">
    <h2 id="notice-title"></h2><p id="notice-copy"></p>
    <form method="dialog"><button class="primary" data-action="dismiss-notice">Close</button></form>
  </dialog>
  <dialog id="add-game" aria-labelledby="add-game-title">
    <h2 id="add-game-title">Add a game</h2>
    <form id="add-game-form">
      <label>Game title<input id="add-game-name" name="title" maxlength="160" required autocomplete="off"></label>
      <label>Executable<input id="add-game-path" name="executable" readonly></label>
      <label>Working folder<input id="add-game-folder" name="workingDirectory" required autocomplete="off"></label>
      <p id="add-game-error" role="alert" hidden></p>
      <div class="dialog-actions"><button type="button" data-action="cancel-add">Cancel</button><button type="submit" class="primary">Add game</button></div>
    </form>
  </dialog>
  <script type="module" src="app.ts"></script>
</body>
</html>
